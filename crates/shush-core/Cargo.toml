[package]
name = "shush-core"
version = "0.1.0"
edition = "2024"

[package.metadata.cargo-machete]
ignored = ["serde_json", "thiserror"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
getrandom = { version = "0.2", features = ["std"] }
